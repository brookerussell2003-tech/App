# One-click deploy on Render: New > Blueprint, pick this repo, then fill in the secret values it asks for.
services:
  - type: web
    name: money-book
    runtime: node
    rootDir: server
    plan: starter            # a paid plan is needed for the disk that keeps your data
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/money-book.db
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
